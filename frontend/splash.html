<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f17" />
    <title>Starting Talenzo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 38%, rgba(18, 75, 104, .44), transparent 48%), #0b0f17;
        color: #e7f4ff;
        font: 600 14px/1.4 "Segoe UI", system-ui, sans-serif;
      }
      .splash-content { display: grid; justify-items: center; gap: 15px; }
      .brand-mark {
        width: 92px;
        height: 92px;
        object-fit: contain;
        filter: drop-shadow(0 0 22px rgba(56, 189, 248, .24));
        animation: mark-float 2.8s ease-in-out infinite;
      }
      .loading-dots { display: flex; align-items: center; gap: 6px; }
      .loading-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #38bdf8;
        animation: dot-pulse 1.05s ease-in-out infinite;
      }
      .loading-dots span:nth-child(2) { animation-delay: .14s; }
      .loading-dots span:nth-child(3) { animation-delay: .28s; }
      @keyframes mark-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes dot-pulse { 0%, 80%, 100% { opacity: .35; transform: scale(.82); } 40% { opacity: 1; transform: scale(1.18); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="splash-content" aria-label="Loading Talenzo">
      <img class="brand-mark" src="./public/icons/talenzo-brand-mark.png" alt="Talenzo" />
      <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </main>
  </body>
</html>
